name: KiCad AI Review (kicad-happy + GitHub Copilot)

# Tier-2 AI design review. Runs the deterministic kicad-happy analysis, then asks
# an LLM through the GitHub Copilot CLI (uses your Copilot subscription -- no
# OpenAI/Anthropic API billing) to review the report and posts the result as a
# PR comment.
#
# REQUIRES repo secret COPILOT_PAT: a fine-grained PAT (owner = you) with the
# account permission 'Copilot Requests'. Without it the AI steps are skipped.
#
# PRIVACY: the analysis report text is sent to GitHub Copilot.
# Same-repo PRs only (fork PRs get no write token). The report is truncated to keep the prompt small.
on:
  pull_request:
    branches: [master]
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'mad_lib/**'
      - '.github/workflows/kicad-happy-ai.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai_review:
    name: AI design review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
      pull-requests: write
    env:
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install analysis dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ngspice poppler-utils

    - name: Deterministic analysis (kicad-happy)
      id: analysis
      uses: aklofas/kicad-happy@main

    - name: Build review prompt
      if: env.COPILOT_PAT != ''
      env:
        REPORT_PATH: ${{ steps.analysis.outputs.report-path }}
      run: |
        set -euo pipefail
        {
          echo "Review this deterministic KiCad analysis report (from kicad-happy) for an STM32L431 CAN/RC peripheral board."
          echo "Do not just restate it. Instead:"
          echo "1. Say which WARNING/CRITICAL findings look genuine vs likely false positives, and why."
          echo "2. Flag design concerns the report may have missed (power, protection, CAN, decoupling)."
          echo "3. Give a short prioritized action list."
          echo "Reply in concise markdown, under 2000 characters."
          echo
          echo "----- REPORT -----"
          head -c 12000 "$REPORT_PATH"
        } > review-prompt.txt

    - name: Install Copilot CLI
      if: env.COPILOT_PAT != ''
      run: npm install -g @github/copilot

    - name: AI review (Copilot CLI)
      if: env.COPILOT_PAT != ''
      id: ai
      uses: actions/ai-inference@v3
      env:
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
      with:
        model: gpt-4.1
        prompt-file: review-prompt.txt

    - name: Post AI review comment
      if: env.COPILOT_PAT != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
      run: |
        set -euo pipefail
        MARKER='<!-- kicad-ai-review -->'
        {
          echo "$MARKER"
          echo "## 🤖 AI Design Review"
          echo
          cat "$RESPONSE_FILE"
          echo
          echo "<sub>Generated by GitHub Copilot from the kicad-happy report; verify against datasheets.</sub>"
        } > comment.md
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"${MARKER}\")) | .id] | first // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
        fi

name: KiCad AI Review (kicad-happy + ChatGPT)

# Tier-2 AI design review. Runs the deterministic kicad-happy analysis, then has
# ChatGPT (openai/codex-action) review the report and post a natural-language
# review as a PR comment.
#
# REQUIRES the repository secret OPENAI_API_KEY (Settings -> Secrets -> Actions).
# Without it the job is skipped.
#
# PRIVACY / COST: design data and the analysis report are sent to OpenAI's API
# (billed per use). Only same-repo PRs run this (fork PRs get no secrets and no write
# token), and only when KiCad files change.
on:
  pull_request:
    branches: [master]
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'mad_lib/**'
      - '.github/workflows/kicad-happy-ai.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai_review:
    name: AI design review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
    - name: Checkout
      if: env.OPENAI_API_KEY != ''
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install analysis dependencies
      if: env.OPENAI_API_KEY != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y ngspice poppler-utils

    - name: Deterministic analysis (kicad-happy)
      if: env.OPENAI_API_KEY != ''
      id: analysis
      uses: aklofas/kicad-happy@main

    - name: AI review (ChatGPT / Codex)
      if: env.OPENAI_API_KEY != ''
      id: codex
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ secrets.OPENAI_API_KEY }}
        sandbox: read-only
        prompt: |
          The kicad-happy deterministic analysis has already been run.
          Read the markdown report at ${{ steps.analysis.outputs.report-path }}
          and the schematic analysis JSON at ${{ steps.analysis.outputs.schematic-json }}.

          Do NOT re-run analysis scripts. Review the findings and:
          1. Verify the top 3-5 IC pinouts against datasheets
          2. Check WARNING/CRITICAL findings for accuracy
          3. Check power sequencing, regulator feedback and protection coverage
          4. Note anything the analysis may have missed

          Reply with a concise markdown summary (under 2000 chars).
          Focus on actionable findings only.

    - name: Post AI review comment
      if: env.OPENAI_API_KEY != '' && steps.codex.outputs.final-message != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW: ${{ steps.codex.outputs.final-message }}
      run: |
        set -euo pipefail
        MARKER='<!-- kicad-ai-review -->'
        printf '%s\n## 🤖 AI Design Review (ChatGPT)\n\n%s\n' "$MARKER" "$REVIEW" > comment.md
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"${MARKER}\")) | .id] | first // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
        fi

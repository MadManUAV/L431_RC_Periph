name: KiCad AI Review (kicad-happy + GitHub Models)

# Tier-2 AI design review. Runs the deterministic kicad-happy analysis, then asks
# an LLM served by GitHub Models (free tier, authenticated with the built-in
# GITHUB_TOKEN -- no API key, no billing) to review the report and posts the
# result as a PR comment.
#
# PRIVACY: the analysis report text is sent to GitHub Models (Azure OpenAI).
# Same-repo PRs only (fork PRs get no write token). GitHub Models free tier is
# rate-limited and has a small input-token cap, so the report is truncated.
on:
  pull_request:
    branches: [master]
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'mad_lib/**'
      - '.github/workflows/kicad-happy-ai.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai_review:
    name: AI design review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
      pull-requests: write
      models: read             # GitHub Models inference
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install analysis dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ngspice poppler-utils

    - name: Deterministic analysis (kicad-happy)
      id: analysis
      uses: aklofas/kicad-happy@main

    - name: Build review prompt
      env:
        REPORT_PATH: ${{ steps.analysis.outputs.report-path }}
      run: |
        set -euo pipefail
        {
          echo "Review this deterministic KiCad analysis report (from kicad-happy) for an STM32L431 CAN/RC peripheral board."
          echo "Do not just restate it. Instead:"
          echo "1. Say which WARNING/CRITICAL findings look genuine vs likely false positives, and why."
          echo "2. Flag design concerns the report may have missed (power, protection, CAN, decoupling)."
          echo "3. Give a short prioritized action list."
          echo "Reply in concise markdown, under 2000 characters."
          echo
          echo "----- REPORT -----"
          head -c 12000 "$REPORT_PATH"
        } > review-prompt.txt

    - name: Probe GitHub Models
      continue-on-error: true
      run: |
        curl -s -i https://models.github.ai/catalog/models -H "Authorization: Bearer ${{ github.token }}" | head -c 600

    - name: AI review (GitHub Models)
      id: ai
      uses: actions/ai-inference@v2.1.1
      with:
        model: openai/gpt-4.1
        prompt-file: review-prompt.txt
        max-tokens: 1000

    - name: Post AI review comment
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
      run: |
        set -euo pipefail
        MARKER='<!-- kicad-ai-review -->'
        {
          echo "$MARKER"
          echo "## 🤖 AI Design Review"
          echo
          cat "$RESPONSE_FILE"
          echo
          echo "<sub>Generated by GitHub Models from the kicad-happy report; verify against datasheets.</sub>"
        } > comment.md
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
          --jq "[.[] | select(.body | contains(\"${MARKER}\")) | .id] | first // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
        fi
